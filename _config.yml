theme: jekyll-theme-cayman
title: Horizon Daily
description: Bilingual daily digest of markets, AI, and geopolitics
baseurl: "/horizon-daily"
url: "https://liuwhui.github.io"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
